{% extends "base.html" %}
{% block head_extra %}
<style>
    .ps-studio {
        display: flex;
        gap: 0;
        min-height: calc(100vh - 200px);
        position: relative;
    }
    .ps-workspaces {
        flex: 1;
        display: flex;
        gap: 16px;
        min-height: 0;
    }
    .ps-ws-card {
        flex: 1;
        min-width: 320px;
        display: flex;
        flex-direction: column;
    }
    .ps-box-group {
        flex: 1;
        display: flex;
        flex-direction: column;
    }
    .ps-textarea {
        flex: 1;
        min-height: 160px;
    }
    @media (max-width: 900px) {
        .ps-workspaces {
            flex-direction: column;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="ps-studio" style="display:flex;flex-direction:column;gap:20px;">
    <div style="padding:12px 16px;background:rgba(129,140,248,0.06);border:1px solid rgba(129,140,248,0.12);border-radius:10px;display:flex;align-items:center;gap:10px;font-size:0.84rem;color:var(--text-secondary, #94a3b8);line-height:1.5;flex-shrink:0;">
        <span style="font-size:1.2rem">💡</span>
        <span>此处可自由组合中文提示词并翻译为英文，用于 <strong style="color:var(--accent-light, #818cf8)">AI 绘图/视频生成</strong>（Midjourney / SD / Runway / Sora）。<br>分析剧本后，点击分析卡片上的「导出」按钮可获得针对该剧本的专属提示词。</span>
    </div>

    <div class="ps-header" style="flex-shrink:0;">
        <span class="ps-title">提示词工坊</span>
        <button class="ps-toggle-btn btn-primary" id="ps-toggle-btn" onclick="togglePanel()">📖 提示词速查</button>
        <button class="btn-secondary" onclick="clearAll()">🗑 清空</button>
        <button class="btn-primary" onclick="translateAll()">🌐 翻译</button>
    </div>

    <div class="ps-workspaces">
        <div class="ps-ws-card">
            <div class="ps-box-group">
                <div class="ps-box-header">
                    <label>🇨🇳 中文提示词</label>
                    <button class="btn-copy-sm" onclick="copyWs('zh')">复制</button>
                </div>
                <textarea class="ps-textarea" id="ws-zh" placeholder="从右侧面板点击标签添加，或直接输入…" oninput="onZhInput()"></textarea>
                <div class="ps-tags" id="tags-zh"></div>
            </div>
        </div>
        <div class="ps-ws-card">
            <div class="ps-box-group">
                <div class="ps-box-header">
                    <label>🇺🇸 English Prompt</label>
                    <button class="btn-copy-sm" onclick="copyWs('en')">复制</button>
                </div>
                <textarea class="ps-textarea" id="ws-en" placeholder="Translation appears here..." readonly></textarea>
                <div class="ps-tags" id="tags-en"></div>
            </div>
        </div>
    </div>

    <div class="ps-actions" style="flex-shrink:0;"></div>
</div>

<div class="ps-panel-overlay" id="ps-overlay" onclick="closePanel()"></div>
<div class="ps-panel" id="ps-panel">
    <div class="ps-panel-header">
        <span class="ps-panel-title">📖 提示词速查手册</span>
        <button class="ps-panel-close" onclick="closePanel()">&times;</button>
    </div>
    <div class="ps-panel-search">
        <input type="text" id="ps-search" placeholder="🔍 搜索所有提示词…" oninput="filterTags()">
    </div>
    <div class="ps-panel-cats" id="ps-panel-cats"></div>
    <div class="ps-panel-tags" id="ps-panel-tags"></div>
</div>

var tagCount = 0;
CATS.forEach(function(c){ tagCount += c.tags.length; });

var addedTags = {};
var activeCat = CATS[0].id;
var elZh, elEn, elTagsZh, elTagsEn, elPanel, elOverlay, elPanelCats, elPanelTags;

document.addEventListener("DOMContentLoaded", function() {
    elZh = document.getElementById("ws-zh");
    elEn = document.getElementById("ws-en");
    elTagsZh = document.getElementById("tags-zh");
    elTagsEn = document.getElementById("tags-en");
    elPanel = document.getElementById("ps-panel");
    elOverlay = document.getElementById("ps-overlay");
    elPanelCats = document.getElementById("ps-panel-cats");
    elPanelTags = document.getElementById("ps-panel-tags");
    buildPanel();
    document.getElementById("ps-toggle-btn").textContent = "📖 提示词速查（" + tagCount + " 词）";
});

function buildPanel() {
    elPanelCats.innerHTML = "";
    elPanelTags.innerHTML = "";
    CATS.forEach(function(cat, ci) {
        var btn = document.createElement("button");
        btn.className = "ps-cat-btn" + (ci === 0 ? " active" : "");
        btn.textContent = cat.icon + " " + cat.name;
        btn.dataset.cat = cat.id;
        btn.style.setProperty("--cat-color", cat.color);
        btn.onclick = function() { switchCat(cat.id); };
        elPanelCats.appendChild(btn);

        var panel = document.createElement("div");
        panel.className = "ps-cat-panel" + (ci === 0 ? " active" : "");
        panel.id = "ps-cat-" + cat.id;
        panel.style.setProperty("--tag-color", cat.color);
        cat.tags.forEach(function(t) {
            var tag = document.createElement("span");
            tag.className = "ps-tag";
            tag.textContent = t.zh;
            tag.title = t.en;
            tag.dataset.zh = t.zh;
            tag.dataset.en = t.en;
            tag.dataset.searchText = (t.zh + " " + t.en).toLowerCase();
            tag.onclick = function() { addTag(t.zh, t.en, cat.color); };
            panel.appendChild(tag);
        });
        elPanelTags.appendChild(panel);
    });
}

function switchCat(id) {
    activeCat = id;
    elPanelCats.querySelectorAll(".ps-cat-btn").forEach(function(b) { b.classList.remove("active"); });
    elPanelTags.querySelectorAll(".ps-cat-panel").forEach(function(p) { p.classList.remove("active"); });
    var panel = document.getElementById("ps-cat-" + id);
    if (panel) panel.classList.add("active");
    var btn = elPanelCats.querySelector('[data-cat="' + id + '"]');
    if (btn) btn.classList.add("active");
}

function addTag(zh, en, color) {
    if (addedTags[zh]) return;
    addedTags[zh] = {zh:zh, en:en, color:color};
    renderTags();
}
function removeTag(zh) { delete addedTags[zh]; renderTags(); }

function renderTags() {
    elTagsZh.innerHTML = ""; elTagsEn.innerHTML = "";
    Object.keys(addedTags).forEach(function(k) {
        var t = addedTags[k];
        var zhChip = document.createElement("span");
        zhChip.className = "ps-added-tag";
        zhChip.style.background = t.color + "18";
        zhChip.style.borderColor = t.color + "40";
        zhChip.style.color = t.color;
        zhChip.innerHTML = t.zh + '<span class="chip-x" style="font-size:0.7rem;opacity:0.6;margin-left:2px;" onclick="event.stopPropagation();removeTag(\'' + k + '\')">×</span>';
        elTagsZh.appendChild(zhChip);

        var enChip = document.createElement("span");
        enChip.className = "ps-added-tag";
        enChip.style.background = t.color + "18";
        enChip.style.borderColor = t.color + "40";
        enChip.style.color = t.color;
        enChip.innerHTML = t.en + '<span class="chip-x" style="font-size:0.7rem;opacity:0.6;margin-left:2px;" onclick="event.stopPropagation();removeTag(\'' + k + '\')">×</span>';
        elTagsEn.appendChild(enChip);
    });
    rebuildText();
}

function rebuildText() {
    var zhParts = [], enParts = [];
    Object.keys(addedTags).forEach(function(k) {
        zhParts.push(k); enParts.push(addedTags[k].en);
    });
    elZh.value = zhParts.join(", ");
    elEn.value = enParts.join(", ");
}

function onZhInput() {
    var tagStr = Object.keys(addedTags).join(", ");
    if (tagStr && elZh.value.indexOf(tagStr) === -1) {
        addedTags = {};
        elTagsZh.innerHTML = "";
        elTagsEn.innerHTML = "";
        elEn.value = "";
    }
}

function togglePanel() { elPanel.classList.toggle("open"); elOverlay.classList.toggle("open"); }
function closePanel() { elPanel.classList.remove("open"); elOverlay.classList.remove("open"); }

function filterTags() {
    var q = (document.getElementById("ps-search").value || "").toLowerCase();
    document.querySelectorAll(".ps-cat-panel").forEach(function(panel) {
        panel.querySelectorAll(".ps-tag").forEach(function(tag) {
            var match = !q || tag.dataset.searchText.indexOf(q) !== -1;
            tag.style.display = match ? "" : "none";
        });
    });
    elPanelCats.querySelectorAll(".ps-cat-btn").forEach(function(btn) {
        var catId = btn.dataset.cat;
        var panel = document.getElementById("ps-cat-" + catId);
        if (!panel) return;
        var total = panel.querySelectorAll('.ps-tag').length;
        var hidden = panel.querySelectorAll('.ps-tag[style*="display: none"]').length;
        btn.style.opacity = (!q || hidden < total) ? "1" : "0.3";
    });
}

function copyWs(id) {
    var box = document.getElementById("ws-" + id);
    if (!box || !box.value.trim()) return;
    navigator.clipboard.writeText(box.value).then(function() { showToast("已复制 ✓", "success"); }).catch(function() { box.select(); document.execCommand("copy"); });
}
function clearAll() { addedTags = {}; elZh.value = ""; elEn.value = ""; renderTags(); }
function translateAll() {
    var text = elZh.value.trim();
    if (!text) return;
    fetch("/api/translate", { method: "POST", credentials: "include", headers: {"Content-Type":"application/json"}, body: JSON.stringify({text:text}) })
    .then(function(r) { return r.json(); })
    .then(function(data) { if (data.translated) { elEn.value = data.translated; showToast("翻译完成 ✓", "success"); } else showToast("翻译失败", "error"); })
    .catch(function() { showToast("网络错误", "error"); });
}
</script>
